portada:
  antetitulo: Asociación guatemalteca · Desde 2026
  titulo: Diagnóstico, acompañamiento e inclusión
  subtitulo: para personas autistas en *Guatemala.*
  texto: Unimos a psicólogas, psiquiatras, familias y personas autistas para acercar evaluaciones diagnósticas comprensivas, acompañar a cada familia y abrir espacios de inclusión en todo el país. **Porque ninguna familia debería recorrer este camino sola.**
  boton_secundario: Necesito orientación
  confianza: '**8 fundadores** de la salud mental, la educación y el derecho, madres, padres y una mujer autista.'
  imagen: /assets/img/hero.webp
  imagen_alt: 'Símbolo de A³: dos personas forman un infinito multicolor con los brazos en alto'
  burbuja: /assets/img/fotos/c7e9b8ad-ff93-44d0-98ec-28febf931918.webp
  burbuja_alt: Profesional de la salud con materiales de evaluación del desarrollo
  dato_cifra: 1 de cada 127
  dato_texto: personas en el mundo es autista
  dato_fuente: Organización Mundial de la Salud, 2025
