porque:
  antetitulo: Por qué existimos
  titulo: El autismo está en todas partes. *El acceso, todavía no.*
  cifra_a: '1'
  cifra_b: '127'
  texto: personas en el mundo es autista. Aun así, la OMS reconoce que <q>se desconoce la prevalencia del autismo en muchos países de ingreso bajo y mediano</q>.
  fuente: 'Fuente: OMS, nota descriptiva sobre autismo (2025)'
  fuente_enlace: https://www.who.int/es/news-room/fact-sheets/detail/autism-spectrum-disorders
  brechas:
    - titulo: Diagnósticos que llegan tarde, o no llegan
      texto: Sin una evaluación comprensiva, muchas personas crecen sin que nadie comprenda sus necesidades ni reconozca sus fortalezas.
      respuesta: 'Nuestra respuesta: **Ruta**'
      programa: ruta
      color: sky
    - titulo: Familias que enfrentan el diagnóstico solas
      texto: Recibir un diagnóstico sin orientación puede ser abrumador. Las familias necesitan información clara y alguien que camine a su lado.
      respuesta: 'Nuestra respuesta: **Travesía**'
      programa: travesia
      color: purple
    - titulo: Comunidades sin información ni espacios
      texto: Donde los servicios especializados son limitados, la detección temprana y la inclusión parecen lejanas.
      respuesta: 'Nuestra respuesta: **A³ en movimiento** y **Conexiones**'
      programa: movimiento
      color: orange
