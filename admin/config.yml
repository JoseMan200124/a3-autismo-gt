# Panel de edición del sitio (Sveltia CMS). Cada guardado es un commit en main y
# Vercel vuelve a publicar el sitio solo, en uno o dos minutos.
# Se entra con usuario y contraseña del sitio (api/entrar.js); no hace falta cuenta
# de GitHub. El servidor (api/gh.js) guarda los cambios con su propio token.
backend:
  name: github
  repo: JoseMan200124/a3-autismo-gt
  branch: main
  base_url: https://autismogt.org
  auth_endpoint: api/entrar
  auth_methods: [oauth]
  api_root: https://autismogt.org/gh/api/v3
  graphql_api_root: https://autismogt.org/gh/api/graphql
  commit_messages:
    create: 'Panel ({{author-name}}): crea {{slug}}'
    update: 'Panel ({{author-name}}): actualiza {{slug}}'
    delete: 'Panel ({{author-name}}): borra {{slug}}'
    uploadMedia: 'Panel ({{author-name}}): sube {{path}}'
    deleteMedia: 'Panel ({{author-name}}): borra {{path}}'
site_url: https://autismogt.org/
display_url: https://autismogt.org/
media_folder: assets/img/fotos
public_folder: /assets/img/fotos
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1920
          height: 1920
collections:
