- name: entradas
  label: A3 Informa · entradas
  label_singular: Entrada
  description: Noticias, guías e historias del blog. Cada entrada se publica en autismogt.org/informa/ y aparece en la portada.
  folder: _posts
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  summary: '{{title}} · {{date}}'
  sortable_fields: [date, title]
  editor:
    preview: true
  fields:
  - label: Título
    name: title
    widget: string
  - label: Fecha
    name: date
    widget: datetime
    picker_utc: false
  - label: Resumen
    name: resumen
    widget: text
    hint: Dos o tres líneas. Se ve en la tarjeta de la portada y en Google.
  - label: Categoría (opcional)
    name: categoria
    widget: select
    required: false
