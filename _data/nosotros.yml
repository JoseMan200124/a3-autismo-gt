antetitulo: Somos A³
titulo: Un punto de encuentro para *conectar* personas, recursos y oportunidades.
texto: |-
  **A³ Autismo Guatemala** es una entidad formal integrada por guatemaltecas y guatemaltecos comprometidos con las personas autistas y sus familias. Desde la educación, la salud, el derecho y la propia experiencia de vida, cada integrante aporta lo que sabe y lo que tiene para cumplir una misma misión.

  Creemos que cada persona autista posee fortalezas, capacidades y un potencial único que merece ser reconocido y acompañado. Por eso trabajamos para reducir barreras, fortalecer a las familias y promover comunidades más inclusivas.
