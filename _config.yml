# Sitio de A³ Autismo Guatemala (GitHub Pages compila con Jekyll).
# Los textos e imágenes viven en _data/ y se editan desde /admin/.
title: "A³ Autismo Guatemala"
url: "https://joseman200124.github.io"
baseurl: "/a3-autismo-gt"
lang: es-GT
timezone: America/Guatemala
markdown: kramdown
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
exclude:
  - README.md
  - EDITAR.md
  - Gemfile
  - Gemfile.lock
  - vercel.json
  - _config.vercel.yml
  - vendor
  - api
  - herramientas
  - package.json
# A3 Informa: las entradas viven en _posts/ y se publican en /informa/<titulo>/
permalink: /informa/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: entrada
