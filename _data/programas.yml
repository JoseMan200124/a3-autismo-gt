antetitulo: Nuestros programas
titulo: Del primer diagnóstico a *cada rincón* de Guatemala.
texto: 'Un recorrido completo: desde la primera sospecha hasta una vida plena en comunidad. Toca cada etapa para conocerla.'
lista:
  - clave: ruta
    nombre: Ruta
    paso: La sospecha se vuelve comprensión
    color: sky
    icono: /assets/img/ruta.webp
    foto: /assets/img/fotos/61E6D073-DC3A-40D8-8863-E4F175B19C68.webp
    foto_alt: Profesional de la salud prepara materiales didácticos de evaluación del desarrollo en un consultorio
    antetitulo: Programa 01 · Ruta A³
    titulo: Evaluación diagnóstica clínica comprensiva y multidisciplinaria
    texto: Facilitamos el acceso a evaluaciones diagnósticas comprensivas para niños, adolescentes y adultos con sospecha de autismo en Guatemala. Con un enfoque multidisciplinario, buscamos identificar o confirmar el diagnóstico y comprender las fortalezas y necesidades de cada persona, generando información que oriente sus apoyos.
    objetivos:
      - texto: Identificar o confirmar el diagnóstico de autismo.
      - texto: Identificar fortalezas, necesidades y apoyos.
      - texto: Elaborar informes diagnósticos comprensivos.
      - texto: Orientar a las personas y sus familias.
    frase: Porque el diagnóstico no te limita, te expande.
  - clave: travesia
    nombre: Travesía
    paso: La familia no camina sola
    color: purple-lt
    icono: /assets/img/travesia.webp
    foto: /assets/img/fotos/62757ef9-c747-4dd1-a736-ce6821ef99f7.webp
    foto_alt: Abuela, madre y bebé, tres generaciones de una familia en Chichicastenango
    antetitulo: Programa 02 · Travesía A³
    titulo: Orientación y acompañamiento para familias
    texto: Acompañamos a familias guatemaltecas que han recibido recientemente un diagnóstico de autismo o están comenzando a comprenderlo. Orientamos sobre el proceso diagnóstico, las rutas de atención y los apoyos disponibles en Guatemala, fortaleciendo a la familia como principal red de apoyo.
    objetivos:
      - texto: Fortalecer la comprensión del autismo y del diagnóstico.
      - texto: Orientar a las familias en la construcción de una ruta de apoyos.
      - texto: Brindar estrategias prácticas para el acompañamiento familiar.
      - texto: Ofrecer escucha y orientación, promoviendo la participación en la comunidad A³.
    frase: Toda travesía comienza con un paso, pero cobra sentido cuando se recorre en compañía.
  - clave: conexiones
    nombre: Conexiones
    paso: La comunidad abre sus puertas
    color: green-lt
    icono: /assets/img/conexiones.webp
    foto: /assets/img/fotos/8a90c472-9cd3-4a06-8694-118e004efcb0.webp
    foto_alt: Barriletes gigantes y familias reunidas en el Festival de Sumpango
    antetitulo: Programa 03 · Conexiones A³
    titulo: Inclusión, participación y encuentro comunitario
    texto: Creamos espacios de encuentro, juego y participación para personas autistas, sus familias y jóvenes comprometidos con la inclusión. A través de una red de **Agentes de Cambio A³**, promovemos espacios seguros, respetuosos y relaciones significativas.
    objetivos:
      - texto: Fortalecer la comprensión del autismo, la inclusión y la participación social.
      - texto: Promover espacios de convivencia inclusiva y relaciones significativas.
      - texto: Formar Agentes de Cambio A³ para el liderazgo y la participación social.
      - texto: Impulsar la participación de las familias en actividades comunitarias.
    frase: Porque es aquí donde la inclusión se convierte en acción.
  - clave: movimiento
    nombre: A³ en movimiento
    paso: La inclusión llega a todo el país
    color: orange
    icono: /assets/img/movimiento.webp
    foto: /assets/img/fotos/5C893CE8-FD41-436B-8A3B-FDC3C10A8E1A.webp
    foto_alt: Vista del Lago de Atitlán y sus volcanes
    antetitulo: Programa 04 · A³ en movimiento
    titulo: Sin fronteras por la inclusión
    texto: Llevamos información, capacitación y oportunidades de detección temprana a comunidades de todo Guatemala, especialmente donde el acceso a servicios especializados es limitado. En jornadas comunitarias acercamos psicoeducación, sensibilización, formación y citas de detección para familias, docentes y profesionales.
    objetivos:
      - texto: Acercar información sobre el autismo a las comunidades.
      - texto: Fortalecer conocimientos sobre autismo e inclusión.
      - texto: Favorecer la detección temprana y orientar a las familias.
      - texto: Reducir barreras de acceso a servicios especializados.
    frase: Cuando la inclusión se pone en movimiento, las fronteras se convierten en caminos.
