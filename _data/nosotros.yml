distingue:
  antetitulo: Lo que nos distingue
  titulo: Cuatro convicciones que guían *cada paso.*
  convicciones:
    - titulo: Juntos llegamos más lejos
      texto: El impacto real ocurre cuando las personas trabajan juntas por un ideal. Conectamos familias, profesionales, instituciones y comunidades para construir redes que generen oportunidades.
      color: purple
    - titulo: Ninguna familia sola
      texto: Ninguna familia debería enfrentar sola los desafíos relacionados con el autismo. Acompañamos con información clara, confiable y basada en evidencia.
      color: yellow-ink
    - titulo: Desde la neurodivergencia
      texto: Toda persona autista merece oportunidades para desarrollarse desde su neurodivergencia, participar y ser valorada dentro de su comunidad.
      color: green
    - titulo: Un diagnóstico que orienta
      texto: Una evaluación diagnóstica comprensiva debe responder a las necesidades de la persona, identificar sus fortalezas y orientar los apoyos que favorezcan su desarrollo.
      color: blue
