antetitulo: "Nuestra esencia"
titulo: "Lo que nos guía y nos impulsa a trabajar *cada día.*"
mision: "Reducir barreras, fortalecer a las familias y promover comunidades más inclusivas mediante evaluación diagnóstica comprensiva para la detección temprana, acompañamiento familiar, formación profesional e inclusión comunitaria."
mision_imagen: "/assets/img/mision.webp"
vision: "Ser una entidad guatemalteca activa, humana y dinámica, reconocida por ampliar el acceso a evaluaciones diagnósticas comprensivas, fortalecer la comprensión del autismo y generar espacios de oportunidad para las personas autistas y sus familias."
vision_imagen: "/assets/img/vision.webp"
aspiracion: "Aspiramos a una Guatemala donde las personas autistas sean *valoradas por sus capacidades*, participen plenamente y tengan acceso a los apoyos que favorezcan su desarrollo."
aspiracion_imagen: "/assets/img/fotos/antigua-calle.webp"
valores_antetitulo: "Nuestros valores"
valores_titulo: "El fundamento de cada decisión, acción y relación."
valores:
  - nombre: "Empatía"
    texto: "Acompañamos con respeto, sensibilidad y cercanía, reconociendo experiencias, necesidades y fortalezas."
    icono: "/assets/img/v-empatia.webp"
    color: "yellow"
  - nombre: "Inclusión"
    texto: "Entornos donde personas autistas y no autistas participan y se sienten valoradas en igualdad de oportunidades."
    icono: "/assets/img/v-inclusion.webp"
    color: "purple"
  - nombre: "Compromiso social"
    texto: "Actuamos con responsabilidad, ética y dedicación para un impacto positivo y sostenible en Guatemala."
    icono: "/assets/img/v-compromiso.webp"
    color: "green"
  - nombre: "Comunidad"
    texto: "Construimos redes de apoyo que fortalecen la participación, la colaboración y el bienestar de todos."
    icono: "/assets/img/v-comunidad.webp"
    color: "sky"
  - nombre: "Solidaridad comunitaria"
    texto: "Creemos en el poder de la acción colectiva para una sociedad más justa, hoy y para las generaciones futuras."
    icono: "/assets/img/v-solidaridad.webp"
    color: "orange"
